name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release (untick to only build and run the emulator test)"
        type: boolean
        default: true

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  android:
    name: Android Export
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The browser upload takes at most 10 MB per file, so the card illustrations travel in
      # extra packs (arte_*.zip). They are unpacked first and projeto.zip goes on top, so a
      # file inside projeto.zip always wins over an older copy in a pack.
      - name: Unpack project
        run: |
          rm -rf project && mkdir project
          for z in arte_*.zip; do
            if [ -f "$z" ]; then unzip -q -o "$z" -d project; fi
          done
          unzip -q -o projeto.zip -d project
          echo "Files in project: $(find project -type f | wc -l)"

      - name: Setup Godot templates and editor settings
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.config/godot ~/.config/godot || true
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable || true

      - name: Import project (first pass)
        run: |
          cd project
          godot --headless --import --quit || true

      - name: Export debug APK
        run: |
          mkdir -v -p build
          EXPORT_DIR="$(readlink -f build)"
          cd project
          godot --headless --verbose --export-debug "Android" "$EXPORT_DIR/ZeroSum.apk"
          ls -la "$EXPORT_DIR"

      # The game checks the latest release on start-up and offers the update in the main menu.
      # Since 0.17.0 the APK carries the version in its name (ZeroSum_v0.17.0.apk), so every download
      # is easy to tell apart on the phone. Installed apps (0.9.0 and later) accept any .apk asset
      # from this repository (AppUpdate.gd), so the new name does not break their update button.
      - name: Read version
        id: ver
        run: |
          NAME=$(sed -n 's/^version\/name="\(.*\)"$/\1/p' project/export_presets.cfg | head -n 1)
          CODE=$(sed -n 's/^version\/code=\([0-9]*\)$/\1/p' project/export_presets.cfg | head -n 1)
          if [ -z "$NAME" ] || [ -z "$CODE" ]; then echo "version/name or version/code missing in export_presets.cfg"; exit 1; fi
          APK="ZeroSum_v$NAME.apk"
          mv build/ZeroSum.apk "build/$APK"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          { echo "code=$CODE"; echo ""; cat project/notas_versao.txt 2>/dev/null || true; } > build/release_body.md
          ls -la build
          cat build/release_body.md

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zero-Sum-APK
          path: build/${{ steps.ver.outputs.apk }}

      - name: Publish release for in-game updates
        if: github.event_name == 'push' || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}-b${{ github.run_number }}
          name: Zero-Sum ${{ steps.ver.outputs.name }}
          body_path: build/release_body.md
          files: build/${{ steps.ver.outputs.apk }}
          make_latest: true

      # Test APK for the emulator job: never attached to the release, never blocks it.
      - name: Export x86_64 test APK (emulator)
        continue-on-error: true
        run: |
          mkdir -v -p build-test
          TEST_DIR="$(readlink -f build-test)"
          cd project
          godot --headless --export-debug "Android x86_64 (teste)" "$TEST_DIR/ZeroSum-x86_64.apk"
          ls -la "$TEST_DIR"

      - name: Upload test APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Zero-Sum-APK-x86_64
          path: build-test/ZeroSum-x86_64.apk
          retention-days: 3

  emulator-test:
    name: Emulator smoke test
    needs: android
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - name: Download test APK
        uses: actions/download-artifact@v4
        with:
          name: Zero-Sum-APK-x86_64
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Write check script
        run: |
          cat > check.sh <<'SH'
          #!/bin/bash
          set -u
          APK=$(ls apk/*.apk | head -1)
          adb install -r "$APK" || { echo "Falhou a instalação"; exit 1; }
          adb logcat -c
          adb shell monkey -p pt.zerosum.game -c android.intent.category.LAUNCHER 1
          sleep 40
          adb exec-out screencap -p > screen_menu.png
          PID=$(adb shell pidof pt.zerosum.game | tr -d '\r')
          adb logcat -d > logcat.txt
          grep -iE "godot|FATAL|AndroidRuntime" logcat.txt > logcat_godot.txt || true
          if [ -z "$PID" ]; then echo "A app fechou-se sozinha"; tail -60 logcat_godot.txt; exit 1; fi
          if grep -qE "FATAL EXCEPTION|SCRIPT ERROR|Parse Error" logcat.txt; then echo "Erros no logcat"; grep -E "FATAL EXCEPTION|SCRIPT ERROR|Parse Error" -A3 logcat.txt | head -60; exit 1; fi
          echo "OK: o jogo abriu e continua a correr (pid $PID)"
          # 0.19.0 (251): performance test - a full battle measures the FPS while idle and during the attack.
          # 0.19.0 (253): the emulator has 3 GB of RAM, like a weak phone; the memory goes into the report.
          adb shell am force-stop pt.zerosum.game
          # adb shell joins its arguments into one command line, so the inner command goes in one quoted string.
          adb shell run-as pt.zerosum.game mkdir -p files || true
          adb shell "run-as pt.zerosum.game sh -c 'echo 1 > files/perf_test.flag'" || true
          if adb shell run-as pt.zerosum.game ls files 2>/dev/null | grep -q perf_test.flag; then echo "Performance flag written"; else echo "::warning::Could not write the performance flag (run-as)"; fi
          adb logcat -c
          adb shell monkey -p pt.zerosum.game -c android.intent.category.LAUNCHER 1
          PERF=""
          for i in $(seq 1 36); do
            sleep 5
            PERF=$(adb logcat -d | grep -o "ZS_PERF.*" | tail -1)
            if [ -n "$PERF" ]; then echo "Performance result after $((i * 5)) s"; break; fi
          done
          adb exec-out screencap -p > screen_battle.png
          adb logcat -d > logcat_perf.txt
          grep -iE "godot|FATAL|AndroidRuntime" logcat_perf.txt > logcat_perf_godot.txt || true
          if grep -qE "FATAL EXCEPTION|SCRIPT ERROR" logcat_perf.txt; then echo "::warning::Errors in the log during the performance test"; grep -E "FATAL EXCEPTION|SCRIPT ERROR" -A3 logcat_perf.txt | head -40; fi
          adb shell dumpsys meminfo pt.zerosum.game > meminfo.txt || true
          grep -E "TOTAL|Graphics|Native Heap" meminfo.txt | head -10 || true
          echo "$PERF" > perf.txt
          if [ -z "$PERF" ]; then echo "::warning::Performance test did not report (ZS_PERF missing)"; exit 0; fi
          echo "$PERF"
          ATTACK=$(echo "$PERF" | sed -n 's/.*attack_fps=\([0-9.]*\).*/\1/p')
          if [ -n "$ATTACK" ] && awk "BEGIN{exit !($ATTACK < 15)}"; then echo "::warning::FPS during the attack dropped to $ATTACK (software GPU in the emulator; compare with the previous build)"; fi
          SH
          chmod +x check.sh

      - name: Run the game on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          ram-size: 3072M
          script: ./check.sh

      - name: Upload screenshot and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Emulator-Report
          path: |
            screen_menu.png
            screen_battle.png
            logcat_godot.txt
            logcat_perf_godot.txt
            perf.txt
            meminfo.txt
          retention-days: 7
